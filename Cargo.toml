[workspace]
resolver = "2"
members = [
  "crates/shiori-core",
  "crates/shiori-storage",
  "apps/shiori-cli",
  "tools/shiori-perf",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }
thiserror = "2.0.21"
rusqlite = { version = "0.42.0", features = ["bundled"] }
