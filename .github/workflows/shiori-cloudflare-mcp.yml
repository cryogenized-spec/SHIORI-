name: Shiori Cloudflare MCP Phase A
on:
  pull_request:
    paths:
      - 'cloudflare/shiori-mcp/**'
      - '.github/workflows/shiori-cloudflare-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and Worker behaviour
        working-directory: cloudflare/shiori-mcp
        run: npm run check
