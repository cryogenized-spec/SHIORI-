name: Temporary Jiff lockfile bootstrap

on:
  push:
    branches: [feat/shiori-jiff1-migration-20261117]
    paths:
      - 'Cargo.toml'
      - '**/Cargo.toml'

permissions:
  contents: write

jobs:
  resolve-lockfile:
    if: github.repository == 'cryogenized-spec/SHIORI-' && github.ref == 'refs/heads/feat/shiori-jiff1-migration-20261117'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Resolve new locked dependencies without running code
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit the resolved lockfile to the migration branch
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build(rust): resolve pinned Jiff 1.0 lockfile [skip ci]"
            git push origin HEAD:feat/shiori-jiff1-migration-20261117
          fi
