name: Agent skills validation

on:
  pull_request:
    paths:
      - ".github/skills/**"
      - ".github/copilot-instructions.md"
      - "docs/third-party/**"
      - "scripts/validate_agent_skills.py"
      - ".github/workflows/agent-skills.yml"
  push:
    branches: [main]
    paths:
      - ".github/skills/**"
      - ".github/copilot-instructions.md"
      - "docs/third-party/**"
      - "scripts/validate_agent_skills.py"
      - ".github/workflows/agent-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-metadata:
    name: Validate vendored skills and references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate skill metadata and reference files
        run: python3 scripts/validate_agent_skills.py
